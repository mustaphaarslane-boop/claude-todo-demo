<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly – To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5fb;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
               radial-gradient(900px 500px at 100% 0%, #fce7f3 0%, transparent 55%);
    --card: #ffffff;
    --text: #1e2235;
    --muted: #7b8199;
    --border: #e6e8f2;
    --primary: #5b5ef4;
    --primary-soft: #eceeff;
    --danger: #ef4444;
    --success: #22c55e;
    --shadow: 0 20px 50px -20px rgba(40, 45, 110, .25), 0 2px 6px rgba(40, 45, 110, .05);
    --radius: 18px;
  }
  [data-theme="dark"] {
    --bg: #0f1120;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1d2150 0%, transparent 60%),
               radial-gradient(900px 500px at 100% 0%, #2a1535 0%, transparent 55%);
    --card: #171a2e;
    --text: #eceefb;
    --muted: #8b90ad;
    --border: #262a45;
    --primary: #7b7eff;
    --primary-soft: #232650;
    --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg) var(--bg-grad) no-repeat;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    transition: background .3s, color .3s;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 32px;
    align-self: flex-start;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
  .date { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 1.1rem;
    display: grid; place-items: center; transition: .2s;
  }
  .icon-btn:hover { background: var(--primary-soft); transform: translateY(-1px); }

  .progress-wrap { margin-bottom: 24px; }
  .progress-info { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .progress-info strong { color: var(--text); }
  .bar { height: 8px; background: var(--primary-soft); border-radius: 99px; overflow: hidden; }
  .bar > span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #5b5ef4, #a855f7);
    border-radius: 99px; transition: width .4s ease;
  }

  form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .input-main {
    flex: 1 1 220px; padding: 14px 16px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px; outline: none; transition: .2s;
  }
  [data-theme="dark"] .input-main, [data-theme="dark"] select { background: #101326; }
  .input-main:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  select {
    padding: 14px 12px; font: inherit; font-size: .9rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px; outline: none; cursor: pointer;
  }
  .add-btn {
    padding: 14px 22px; font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #5b5ef4, #8b5cf6);
    box-shadow: 0 8px 20px -8px rgba(91, 94, 244, .7); transition: .2s;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px -8px rgba(91, 94, 244, .8); }
  .add-btn:active { transform: translateY(0); }

  .filters { display: flex; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; margin-bottom: 18px; border: 1px solid var(--border); }
  [data-theme="dark"] .filters { background: #101326; }
  .filters button {
    flex: 1; padding: 9px; font: inherit; font-size: .88rem; font-weight: 500; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); cursor: pointer; transition: .2s;
  }
  .filters button.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(40, 45, 110, .12); }

  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  li {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--card);
    animation: pop .25s ease; transition: .2s;
  }
  li:hover { border-color: var(--primary); transform: translateX(2px); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  li.removing { opacity: 0; transform: translateX(30px); }

  .check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: none; border: 2px solid var(--border);
    border-radius: 7px; cursor: pointer; display: grid; place-items: center; transition: .2s; }
  .check:hover { border-color: var(--primary); }
  .check:checked { background: var(--success); border-color: var(--success); }
  .check:checked::after { content: ''; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }

  .text { flex: 1; min-width: 0; }
  .text .title { word-break: break-word; font-weight: 500; cursor: text; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .text input { width: 100%; font: inherit; padding: 4px 8px; border: 1px solid var(--primary); border-radius: 8px; background: var(--card); color: var(--text); outline: none; }

  .tag { font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; flex: none; }
  .tag.low { background: #dcfce7; color: #15803d; }
  .tag.medium { background: #fef3c7; color: #b45309; }
  .tag.high { background: #fee2e2; color: #b91c1c; }
  [data-theme="dark"] .tag.low { background: #14341f; color: #6ee7a0; }
  [data-theme="dark"] .tag.medium { background: #3a2c10; color: #fbbf24; }
  [data-theme="dark"] .tag.high { background: #3b1717; color: #fca5a5; }

  .del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 6px 8px; border-radius: 8px; transition: .2s; }
  .del:hover { color: var(--danger); background: #fee2e2; }
  [data-theme="dark"] .del:hover { background: #3b1717; }

  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
  .empty .emoji { font-size: 2.4rem; display: block; margin-bottom: 8px; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: .85rem; color: var(--muted); }
  .clear { border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: .2s; }
  .clear:hover { color: var(--danger); background: var(--primary-soft); }

  @media (max-width: 520px) {
    body { padding: 20px 12px; }
    .app { padding: 22px 18px; }
    .add-btn { flex: 1 1 100%; }
    select { flex: 1; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>My Tasks</h1>
        <p class="date" id="date"></p>
      </div>
      <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </header>

    <section class="progress-wrap">
      <div class="progress-info">
        <span><strong id="doneCount">0</strong> of <strong id="totalCount">0</strong> completed</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar"><span id="barFill"></span></div>
    </section>

    <form id="form">
      <input class="input-main" id="input" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="120" required>
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="add-btn" type="submit">+ Add task</button>
    </form>

    <nav class="filters" id="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </nav>

    <ul id="list"></ul>

    <footer>
      <span id="left">0 tasks left</span>
      <button class="clear" id="clear">Clear completed</button>
    </footer>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'taskly.todos', THEME_KEY = 'taskly.theme';

  let todos = [];
  let filter = 'all';

  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

  // Theme
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('theme').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

  // Date
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  function render() {
    const list = $('list');
    list.innerHTML = '';
    const shown = todos.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));

    if (!shown.length) {
      const msgs = { all: ['✨', 'Nothing here yet. Add your first task!'], active: ['🎉', 'All caught up!'], completed: ['📭', 'No completed tasks yet.'] };
      list.innerHTML = `<div class="empty"><span class="emoji">${msgs[filter][0]}</span>${msgs[filter][1]}</div>`;
    }

    shown.forEach(t => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'check'; cb.checked = t.done;
      cb.setAttribute('aria-label', 'Mark as done');
      cb.onchange = () => { t.done = cb.checked; save(); render(); };

      const text = document.createElement('div');
      text.className = 'text';
      const title = document.createElement('span');
      title.className = 'title'; title.textContent = t.text; title.title = 'Double-click to edit';
      title.ondblclick = () => edit(t, text, title);
      text.appendChild(title);

      const tag = document.createElement('span');
      tag.className = 'tag ' + t.priority; tag.textContent = t.priority[0].toUpperCase() + t.priority.slice(1);

      const del = document.createElement('button');
      del.className = 'del'; del.innerHTML = '✕'; del.setAttribute('aria-label', 'Delete task');
      del.onclick = () => {
        li.classList.add('removing');
        setTimeout(() => { todos = todos.filter(x => x.id !== t.id); save(); render(); }, 200);
      };

      li.append(cb, text, tag, del);
      list.appendChild(li);
    });

    const done = todos.filter(t => t.done).length;
    const total = todos.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $('doneCount').textContent = done;
    $('totalCount').textContent = total;
    $('percent').textContent = pct + '%';
    $('barFill').style.width = pct + '%';
    const left = total - done;
    $('left').textContent = `${left} ${left === 1 ? 'task' : 'tasks'} left`;
    $('clear').style.visibility = done ? 'visible' : 'hidden';
  }

  function edit(t, wrap, title) {
    const input = document.createElement('input');
    input.value = t.text; input.maxLength = 120;
    wrap.replaceChild(input, title);
    input.focus(); input.select();
    const commit = () => { const v = input.value.trim(); if (v) t.text = v; save(); render(); };
    input.onblur = commit;
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = t.text; input.blur(); } };
  }

  $('form').onsubmit = (e) => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now() + Math.random(), text, priority: $('priority').value, done: false });
    $('input').value = '';
    save(); render();
  };

  $('filters').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    render();
  };

  $('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

  render();
</script>
</body>
</html>
